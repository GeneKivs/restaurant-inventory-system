<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Module</title>
    <link rel="stylesheet" href="style.css">
    <script>
        function saveAndConfirm(form) {
            // Submit the form and wait for a response from the backend
            form.submit();
    
            // After submission, confirm and print
            const orderID = document.getElementById("orderID").value;
            const item = document.getElementById("item").selectedOptions[0].text;
            const supplier = form.querySelector('select[name="supplier.supplierID"]').selectedOptions[0].text;
            const orderDate = document.getElementById("orderDate").value;
            const quantity = document.getElementById("quantity").value;
            const unit = form.querySelector('select[name="unit.unitID"]').selectedOptions[0].text;
    
            const confirmation = confirm("Order saved successfully. Do you want to print this order?");
            if (confirmation) {
                // Create the print content
                const printContent = `
                    <h3>Purchase Order</h3>
                    <p><strong>Order ID:</strong> ${orderID}</p>
                    <p><strong>Item Name:</strong> ${item}</p>
                    <p><strong>Supplier Name:</strong> ${supplier}</p>
                    <p><strong>Date of Order:</strong> ${orderDate}</p>
                    <p><strong>Quantity:</strong> ${quantity}</p>
                    <p><strong>Unit:</strong> ${unit}</p>
                `;
    
                // Open a new window for printing
                const printWindow = window.open('', '', 'height=600,width=800');
                printWindow.document.write('<html><head><title>Print Purchase Order</title></head><body>');
                printWindow.document.write(printContent);
                printWindow.document.write('</body></html>');
                printWindow.document.close();
                printWindow.print();
            }
    
            return false; // Prevent the default form submission flow
        }
    </script>
    
    

</head>
<body>
    <div class="header">
        <div class="logo">Inventory Module</div>
        <div class="icons">
            <i class="notification">🔔<span class="badge">3</span></i>
            <i class="help">❓</i>
        </div>
    </div>

    <div class="sidebar">
        <ul>
            <li><a th:href="@{/}">Dashboard</a></li>
            <li><a th:href="@{/inventory}">Inventory</a></li>
            <li class="active">Purchase Module</li>
            <li><a th:href="@{/admin}">Admins</a> </li>
            <li><a th:href="@{/report}">Reports</a></li>
            <li><a th:href="@{/setting}">Profile</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div id="purchaseOrder" class="form-container">
            <h3>Purchase Order</h3>
            <div class="action-buttons">
                <button class="add">Add</button>
                <button><a th:href="@{/purchase}">EXIT</a></button>
            </div>
            
                <form th:action="@{/purchaseOrder}" method="get">
                    <label for="item">Item:</label>
                    <select name="itemID" id="item" onchange="this.form.submit()" >
                        <option value="">-- Select an Item --</option>
                        <th:block th:each="item : ${items}">
                            <option th:value="${item.itemID}" th:text="${item.itemName}" th:selected="${item.itemID == param.itemID}"></option>
                        </th:block>
                    </select>
                
                </form>
                <form id="purchaseOrderForm" th:action="@{/saveOrder}" th:object="${purchaseOrder}" method="POST" onsubmit="return saveAndConfirm(this)">
                    <input type="hidden"   name="itemID" th:value="${param.itemID}" />
                    <div th:if="${selectedItemName}">
                        <p>Selected Item: <span th:text="${selectedItemName}"></span></p>
                    </div>
                    <label for="supplierID">Supplier Name:</label>
                <select name="supplier.supplierID" required>
                    <option value="" >Select Supplier</option>
                    <th:block th:each="supplier : ${suppliers}">
                        <option th:value="${supplier.supplierID}" th:text="${supplier.supplierName}"></option>
                    </th:block>
                </select>
                <label for="orderDate">Date of Order:</label>
                <input type="text" id="orderDate" name="orderDate" th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" readonly>
              
                <label for="quantity">Quantity:</label>
                <input type="number"  th:field="*{quantity}" required />
              
                <label for="unitID">Unit </label>
                    <select name="unit.unitID" required>
                        <option value="">Select Unit</option>
                        <option th:each="unit : ${units}" th:value="${unit.unitID}" th:text="${unit.unitAbbriviation}"></option>
                    </select>
              
                <label for="orderStatus">Order Status:</label>
                <input type="text" id="orderStatus" readonly value="Pending" />
              
               
              
                <button type="submit" id="saveOrder">Save Order</button>
              </form>
              
        </div>
    </div>
    
</body>
</html>
