<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="header">
        <div class="logo">Dashboard</div>
        <div class="icons">
            <i class="notification">🔔<span class="badge">3</span></i>
            <i class="help">❓</i>
        </div>
    </div>

    <div class="sidebar">
        <ul>
            <li><a th:href="@{/dashboard}">Dashboard</a></li>
            <li><a th:href="@{/inventory}">Inventory </a> </li>
            <li><a th:href="@{/purchase}">Purchase</a></li>
            <li><a th:href="@{/admin}">Admins</a> </li>
            <li class="active">Reports</li>
            <li><a th:href="@{/profile}">Profile Setting</a></li>
            <li><a th:href="@{/logout}" onclick="return confirm('Are you sure you want to log out?')">Logout</a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <h2>Report Module</h2>
        <div class="tab-buttons">
            <a th:href="@{/report/listing}"><button>Listing Reports</button></a>
            
            <a th:href="@{/report/transactional}"><button>Transactional Reports</button></a>
        </div>

        <!-- Placeholder to prevent blank page -->
        <div class="report-placeholder">
            <p>Select a report type to view and generate reports.</p>
        </div>
    </div>

    
</body>
</html>
