<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Module</title>
    <link rel="stylesheet" href="style.css">
    <script>
        function filterTable() {
            let input = document.getElementById('searchInput'); // Get the search input
            let filter = input.value.toLowerCase(); // Convert input to lowercase for case-insensitive search
            let table = document.querySelector('table'); // Get the table element
            let rows = table.getElementsByTagName('tr'); // Get all rows in the table

            // Loop through the rows and hide the ones that don't match the search query
            for (let i = 1; i < rows.length; i++) {
                let cells = rows[i].getElementsByTagName('td');
                let itemName = cells[1] ? cells[1].textContent.toLowerCase() : ''; // Get the Item Name cell text

                if (itemName.indexOf(filter) > -1) {
                    rows[i].style.display = ''; // Show the row if it matches the filter
                } else {
                    rows[i].style.display = 'none'; // Hide the row if it doesn't match
                }
            }
        }
    </script>

</head>
<body>
    <div class="header">
        <div class="logo">Inventory Module</div>
        <div class="icons">
            <i class="notification">🔔<span class="badge">3</span></i>
            <i class="help">❓</i>
        </div>
    </div>

    <div class="sidebar">
        <ul>
            <li><a th:href="@{/}">Dashboard</a></li>
            <li class="active">Inventory Module</li>
            <li><a th:href="@{/purchase}">Purchase</a></li>
            <li><a th:href="@{/admin}">Admins</a> </li>
            <li><a th:href="@{/report}">Reports</a></li>
            <li><a th:href="@{/setting}">Profile</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="tab-buttons">
            <button ><a th:href="@{/item}">Item Definition</a></button>
            <button ><a th:href="@{/unit}">Unit Definition</a></button>
            <button ><a th:href="@{/category}">Category Definition</a></button>
            <button ><a th:href="@{/receivedItem}">Received Items</a></button>
            <button><a th:href="@{/issuedItem}"> Issued Items</a></button>
        </div>
        <div class="search-bar">
            <label for="searchInput">Search Items:</label>
            <input type="text" id="searchInput" placeholder="Search for an item..." onkeyup="filterTable()">
        </div>
        <div class="table-container">
            <h3>Items</h3>
            <table>
                <thead>
                    <tr>
                        <th>Item ID</th>
                        <th>Item Name</th>
                        <th>Category</th>
                        <th>Unit</th>
                        <th>Quantity</th>
                        <th>Reorder Level</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.itemID}"></td>
                        <td th:text="${item.itemName}"></td>
                        <td th:text="${item.category.categoryName}"></td>
                        <td th:text="${item.unit.unitAbbriviation}"></td>
                        <td th:text="${item.quantity}"></td>
                        <td th:text="${item.reorderlevel}"></td>
                        <td>
                            <a th:href="@{/itemUpdate/{itemID}(itemID=${item.itemID})}">
                                <button class="edit">Edit</button>
                            </a>
                            <form th:action="@{/deleteItem/{itemID}(itemID=${item.itemID})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this item?');">
                                <input type="hidden" name="_method" value="delete" />
                                <button type="submit" class="delete">Delete</button>
                            </form>
                                
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>
    

   
</body>
</html>
