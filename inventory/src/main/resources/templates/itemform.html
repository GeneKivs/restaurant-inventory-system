<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Definition</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="header">
        <div class="logo">Inventory Module</div>
        <div class="icons">
            <i class="notification">🔔<span class="badge">3</span></i>
            <i class="help">❓</i>
        </div>
    </div>

    <div class="sidebar">
        <ul>
            <li><a th:href="@{/dashboard}">Dashboard</a></li>
            <li class="active">Inventory Module</li>
            <li><a th:href="@{/purchase}">Purchase</a></li>
            <li><a th:href="@{/admin}">Admins</a> </li>
            <li><a th:href="@{/report}">Reports</a></li>
            <li><a th:href="@{/setting}">Profile</a></li>
        </ul>
    </div>

    <div class="main-content">
       

        <div id="itemDefinition" >
            <h3>Item Definition</h3>
            <div class="action-buttons">
                
                <button><a th:href="@{/inventory}">EXIT</a></button>
            </div>
            <div>

            </div>
            <div class="form-container">
                <form th:action="@{/saveItem}"th:object="${item}" method="post">
                    <label for="itemName">Item Name:</label>
                    <input type="text" th:field="*{itemName}" placeholder="Item Name" required>

                    <label for="categoryID">Category Name</label>
                    <select name="category.categoryID" required>
                        <option value="">Select Category</option>
                        <option th:each="category : ${categories}" th:value="${category.categoryID}" th:text="${category.categoryName}"></option>
                    </select>

                    <label for="unitID">Unit Name</label>
                    <select name="unit.unitID" required>
                        <option value="">Select Unit</option>
                        <option th:each="unit : ${units}" th:value="${unit.unitID}" th:text="${unit.unitAbbriviation}"></option>
                    </select>

                    <label for="reorderlevel">Reorder Level</label>
                    <input type="number" th:field="*{reorderlevel}"  placeholder="Reorder Level" required>
                    <button type="submit">Save Item</button>
                </form>
            </div>
            <div class="table-container">
                <h3>Items</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Item ID</th>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Unit</th>
                            <th>Quantity</th>
                            <th>Reorder Level</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${items}">
                            <td th:text="${item.itemID}"></td>
                            <td th:text="${item.itemName}"></td>
                            <td th:text="${item.category.categoryName}"></td>
                            <td th:text="${item.unit.unitAbbriviation}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td th:text="${item.reorderlevel}"></td>
                            <td>
                                <a th:href="@{/itemUpdate/{itemID}(itemID=${item.itemID})}">
                                    <button class="edit">Edit</button>
                                </a>
                                <form th:action="@{/deleteItem/{itemID}(itemID=${item.itemID})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this item?');">
                                    <input type="hidden" name="_method" value="delete" />
                                    <button type="submit" class="delete">Delete</button>
                                </form>
                                    
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
        </div>

      
    
</body>
</html>
