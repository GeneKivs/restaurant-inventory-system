<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Form</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="header">
        <div class="logo">Inventory Module</div>
        <div class="icons">
            <i class="notification">🔔<span class="badge">3</span></i>
            <i class="help">❓</i>
        </div>
    </div>

    <div class="sidebar">
        <ul>
            <li><a th:href="@{/}">Dashboard</a></li>
            <li class="active">Inventory Module</li>
            <li><a th:href="@{/purchase}">Purchase</a></li>
            <li><a th:href="@{/admin}">Admins</a> </li>
            <li><a th:href="@{/report}">Reports</a></li>
            <li><a th:href="@{/setting}">Profile</a></li>
        </ul>
    </div>

        <div class="main-content">
             <div class="form-container" >
                <h3>Category Definition</h3>
                <div class="action-buttons">
                    <button class="add">Add</button>
                   
                    <button><a th:href="@{/inventory}">EXIT</a></button>
                </div>
                <form th:action="@{/saveCategory}" th:object="${category}" method="POST">
                <input type="text" th:field="*{categoryName}" placeholder="Category Name">
                <button type="submit">Save Category</button>
                </form>
           
            </div>
            <div class="table-container">
                <h3>Categories</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Category ID</th>
                            <th>Category Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="category : ${categories}">
                            <td th:text="${category.categoryID}">Category ID</td>
                            <td th:text="${category.categoryName}">Category Name</td>
                            <td>
                                <a th:href="@{/categoryupdate/{categoryID}(categoryID=${category.categoryID})}">
                                    <button class="edit">Edit</button>
                                </a>
                                <form th:action="@{/deleteCategory/{categoryID}(categoryID=${category.categoryID})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this category?');">
                                    <input type="hidden" name="_method" value="delete" />
                                    <button type="submit" class="delete">Delete</button>
                                </form>
                                    
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    
</body>
</html>
