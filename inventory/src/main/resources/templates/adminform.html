<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Module</title>
    <link rel="stylesheet" href="/style.css">
    <script>
        function closeMessage(className) {
            var message = document.querySelector('.' + className);
            if (message) {
                message.style.display = 'none';
            }
        }
    </script>
</head>
<body>
    <div class="header">
        <div class="logo">Admin Module</div>
        <div class="icons">
            <i class="notification">🔔<span class="badge">3</span></i>
            <i class="help">❓</i>
        </div>
    </div>

    <div class="sidebar">
        <ul>
            <li><a  th:href="@{/dashboard}">Dashboard</a></li>
            <li><a th:href="@{/inventory}">Inventory </a> </li>
            <li><a th:href="@{/purchase}">Purchase</a></li>
            <li class="active">Admins</li>
            <li><a th:href="@{/report}">Reports</a></li>
            <li><a th:href="@{/profile}">Profile Setting</a></li>
            <li><a th:href="@{/logout}" onclick="return confirm('Are you sure you want to log out?')">Logout</a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <div class="tab-buttons">
            <button ><a th:href="@{/userRegistration}">User Registration</a></button>
           
            <button ><a th:href="@{/roles}">Role Definition</a></button>
        </div>
                <!-- Success and Error Messages with Named Buttons -->
<div th:if="${errorMessage}" class="error-message">
    <p th:text="${errorMessage}"></p>
    <button class="error-btn" onclick="closeMessage('error-message')">OK</button>
</div>
<div th:if="${successMessage}" class="success-message">
    <p th:text="${successMessage}"></p>
    <button class="success-btn" onclick="closeMessage('success-message')">OK</button>
</div>

        <div class="table-container">
            <h3>Users</h3>
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>email</th>
                        <th>phone Number</th>
                        
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.userID}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.phoneNumber}"></td>
                        
                        <td>
                            
                               
                            <a th:href="@{/updateUser/{userID}(userID=${user.userID})}">
                                <button class="edit">Edit</button>
                            </a>
                            
                            
                                
                                <form th:action="@{/deleteUser/{userID}(userID=${user.userID})}" method="post" style="display:inline;">
                                    <button class="delete" type="submit" onclick="return confirm('Are you sure you want to set this user as inactive?')">Delete</button>
                                </form>
                            
                                
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>

    
</body>
</html>
